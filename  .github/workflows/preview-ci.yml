name: Preview CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify application source exists
        run: |
          test -f package.json || { echo 'BLOCKED: package.json is missing; upload the complete MB Grow Lab source before building.'; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check (when script exists)
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.typecheck ? 0 : 1)" && npm run typecheck || { code=$?; if [ "$code" -eq 1 ] && ! node -e "process.exit(require('./package.json').scripts?.typecheck ? 1 : 0)"; then echo 'No typecheck script; skipping'; else exit "$code"; fi; }
      - name: Build
        run: npm run build
